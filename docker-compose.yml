version: '3.8'

services:
  one-health-ai:
    build: .
    container_name: one-health-ai-platform
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./qr_codes:/app/qr_codes
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

